name: CI/CD Frontend

on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username:     ${{ secrets.ACR_USERNAME }}
          password:     ${{ secrets.ACR_PASSWORD }}

      - name: Build & push frontend image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/turnos-frontend
          docker build \
            --build-arg VITE_API_URL=https://turnos-backend.salmonbeach-c6552686.eastus.azurecontainerapps.io \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name turnos-frontend \
            --resource-group rg-sistema-turnos \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/turnos-frontend:${{ github.sha }}
